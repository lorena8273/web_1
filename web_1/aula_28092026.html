<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <title>Document</title>
</head>
<body>
    <header>
        <h1>Tecnologias web</h1>
        <p>Exemplos de imagens utilizadas em uma página HTML.</p>
    </header>

    <main>

    <session>
        <h2>HTML</h2>
        <p>Carregando uma imagem que está na mesma pasta do arquivo HTML</p>
        <figure>
            <img src="imagens/logo_html.png" alt="Logo Html">
            <figcaption>
                Logo html
            </figcaption>
        </figure>
    </session>

    <session>
        <h2>CSS</h2>
        <p>Carregando uma imagem que está dentro de uma subpasta</p>
        <figure>
            <img src="imagens/logo_css.png" alt="Logo CSS">
            <figcaption>
                Logo CSS
            </figcaption>
        </figure>
    </session>

    <session>
        <h2>JavaScript</h2>
        <p>Carregando uma imagem externa utilizando uma URL.</p>
        <figure>
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSrQgcMHFcN7ukZjF6n9P9gOhSD8pBc1tyS4qCDxMYZHA&s=10"
            alt="Logo JavaScript">
        </figure>
        <figcaption>Logo do JavaScript</figcaption>
    </session>

    </main>

</body>
</html>
